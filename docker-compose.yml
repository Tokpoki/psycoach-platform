services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
      - ./requirements.txt:/app/requirements.txt:ro
    environment:
      - DATABASE_URL=
      - JWT_SECRET=
      - JWT_ALGO=
      - JWT_EXPIRE_MINUTES=
      - CORS_ORIGINS=
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  seed:
    build: .
    command: python -m backend.app.db.seed
    volumes:
      - ./backend:/app/backend
      - ./requirements.txt:/app/requirements.txt:ro
    environment:
      - DATABASE_URL=
      - JWT_SECRET=
      - JWT_ALGO=
      - JWT_EXPIRE_MINUTES=
      - CORS_ORIGINS=
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
